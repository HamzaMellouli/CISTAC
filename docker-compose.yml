version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai4brain_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai4brain:ai4brain_secret@db:5432/ai4brain_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai4brain_net

  frontend:
    build:
      context: ./dashboard_ui
      dockerfile: Dockerfile
    container_name: ai4brain_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - ai4brain_net

  db:
    image: pgvector/pgvector:pg16
    container_name: ai4brain_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ai4brain
      POSTGRES_PASSWORD: ai4brain_secret
      POSTGRES_DB: ai4brain_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai4brain -d ai4brain_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai4brain_net

  redis:
    image: redis:7-alpine
    container_name: ai4brain_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ai4brain_net

volumes:
  pgdata:
  redisdata:

networks:
  ai4brain_net:
    driver: bridge
